<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sanātana — The Eternal Order</title>
<meta name="description" content="A bilingual (English · ગુજરાતી) reader's guide to Sanātana Dharma.">
<meta name="theme-color" content="#D9D3C7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cinzel:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@300;400;600&family=Noto+Serif+Gujarati:wght@400;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#CFC9BC;font-family:'Work Sans',system-ui,sans-serif}
*{box-sizing:border-box}
#phone{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;background:#E5E1D9;box-shadow:0 2px 4px rgba(0,0,0,.08),0 26px 64px rgba(60,50,30,.28);border:1px solid rgba(60,50,30,.18);font-family:'Cormorant Garamond',Georgia,serif;color:#2E2B26}
#stage{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto}
.scroll::-webkit-scrollbar{width:0;height:0}
button,input{font-family:inherit}
@keyframes sdSpin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes sdSpinR{from{transform:translate(-50%,-50%) rotate(360deg)}to{transform:translate(-50%,-50%) rotate(0)}}
@keyframes sdBreathe{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:.85;transform:translate(-50%,-50%) scale(1.06)}}
@keyframes sdDust{0%{transform:translateY(0);opacity:0}20%{opacity:.7}100%{transform:translateY(-120px);opacity:0}}
@keyframes sdFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
a{color:#B0801F;text-decoration:none}a:hover{color:#8A6A2A}
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#DAD4C7,#C3BCAD)">
<div id="phone"><div id="stage"></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
